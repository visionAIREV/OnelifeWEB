<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10101a">
  <meta name="description" content="Kumpulan tautan Instagram, WhatsApp, dan dokumentasi 17 Okt Pendopo.">
  <title>Link Saya | MW Firgiawan</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10101a;
      --panel: rgba(27, 28, 45, .82);
      --text: #f7f7fb;
      --muted: #a9aabd;
      --border: rgba(255,255,255,.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(131, 58, 180, .25), transparent 38%),
        radial-gradient(ellipse at 90% 80%, rgba(0, 180, 170, .15), transparent 36%),
        var(--bg);
    }
    .wrap { width: 100%; max-width: 440px; }
    .card {
      padding: 30px 24px 24px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    .avatar {
      width: 82px; height: 82px; margin: 0 auto 16px;
      display: grid; place-items: center; border-radius: 25px;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      box-shadow: 0 10px 30px rgba(225, 48, 108, .24);
    }
    .avatar svg { width: 43px; height: 43px; }
    h1 { margin: 0; text-align: center; font-size: clamp(1.55rem, 5vw, 1.9rem); letter-spacing: -.04em; }
    .subtitle { margin: 8px 0 26px; color: var(--muted); text-align: center; font-size: .95rem; line-height: 1.5; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 76px; padding: 14px 16px;
      color: var(--text); text-decoration: none;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--border); border-radius: 18px;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px); background: rgba(255,255,255,.085);
      border-color: rgba(255,255,255,.24); outline: none;
    }
    .icon {
      width: 46px; height: 46px; flex: 0 0 46px;
      display: grid; place-items: center; border-radius: 14px;
    }
    .icon svg { width: 25px; height: 25px; }
    .instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .whatsapp { background: #1b9b68; }
    .drive { background: #2867d8; }
    .copy { min-width: 0; flex: 1; }
    .label { display: block; font-weight: 750; font-size: 1rem; }
    .detail { display: block; margin-top: 4px; color: var(--muted); font-size: .82rem; overflow-wrap: anywhere; }
    .arrow { color: #c6c7d6; font-size: 1.4rem; padding-left: 4px; }
    .footer { margin: 22px 0 0; text-align: center; color: #77798f; font-size: .78rem; }
    @media (max-width: 360px) { .card { padding: 24px 16px 20px; } .link { padding: 12px; gap: 11px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="page-title">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.8" r="1" fill="white" stroke="none"></circle>
        </svg>

      <h1 id="page-title">MW Firgiawan</h1>

          <span class="icon instagram" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"></circle>

            </svg>

          <span class="icon drive" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.2 4h7.1l6 10.3-3.5 6H10.7l3.5-6Z"></path><path d="M8.2 4 2.7 14.3l3.5 6 5.9-10.3"></path><path d="M2.7 14.3h12.1"></path>

        </a>
      </nav>
      <p class="footer">© <span id="year"></span> MW Firgiawan</p>
    </section>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
